<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selamat Datang - CS Line</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-effects">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="bg-grid"></div>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="https://cdn.arebermain.club/assets/cdn/az4/2025/04/23/20250423/a82bdc6fb564d0dff3671aeb9a4d1da5/logo.png" alt="CS Line Logo" class="logo">
        <h2>CS <span>Line</span></h2>
      </div>
      <nav class="sidebar-nav">
        <a href="/betting" class="nav-item">
          <span class="nav-icon">🎲</span>
          <span class="nav-text">Cara Betting</span>
        </a>
        <a href="/bank" class="nav-item">
          <span class="nav-icon">🏦</span>
          <span class="nav-text">Bank & E-wallet</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        © 2026 CS Line<br>Info aja ya geys 🌸
      </div>
    </aside>

    <main class="main-content">
      <div class="content-header">
        <div class="breadcrumb">Beranda</div>
        <h1><span style="display:inline-block; animation: orbFloat 3s ease-in-out infinite;">🌸</span> Selamat Datang di CS Line</h1>
        <div class="header-subtitle">
          <span class="hint-dot"></span>
          Pilih menu di samping untuk memulai
        </div>
      </div>

      <div class="content-body">
        <div class="gallery-grid">
          <a href="/betting" class="gallery-item" style="text-decoration: none; animation-delay: 0.1s;">
            <div class="gallery-image">
              <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:4rem; background: linear-gradient(135deg, #FFF0F5, #FDF2F8);">🎲</div>
              <div class="gallery-overlay">
                <div class="overlay-content">
                  <div class="overlay-icon-ring">➡️</div>
                  <span class="overlay-text">Buka Menu</span>
                </div>
              </div>
            </div>
            <div class="gallery-caption">Panduan Cara Betting</div>
          </a>

          <a href="/bank" class="gallery-item" style="text-decoration: none; animation-delay: 0.2s;">
            <div class="gallery-image">
              <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:4rem; background: linear-gradient(135deg, #FFF7ED, #FFFBEB);">🏦</div>
              <div class="gallery-overlay">
                <div class="overlay-content">
                  <div class="overlay-icon-ring">➡️</div>
                  <span class="overlay-text">Buka Menu</span>
                </div>
              </div>
            </div>
            <div class="gallery-caption">Profile Bank & E-wallet</div>
          </a>
        </div>
      </div>

      <footer class="content-footer" style="padding: 24px; text-align: center; color: var(--fg-dim); border-top: 1px solid var(--border); background: rgba(255,255,255,0.5);">
        <div>Last update: 16/06/2026 • © 2026 CS Line</div>
      </footer>
    </main>
  </div>
